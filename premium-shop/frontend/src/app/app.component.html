<header class="sticky top-0 z-50 border-b bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
    <!-- Brand -->
    <a routerLink="/" class="flex items-center gap-2">
      <div class="h-9 w-9 rounded-xl bg-black text-white grid place-items-center font-bold">
        P
      </div>
      <div class="leading-tight">
        <div class="text-sm font-semibold text-gray-900">Premium Shopee</div>
        <div class="text-xs text-gray-500">Digital Subscriptions</div>
      </div>
    </a>

    <!-- Only Home (always visible) -->
    <nav class="flex items-center gap-2">
      <a routerLink="/" routerLinkActive="bg-black text-white" [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-xl px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
        Home
      </a>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6">
  <router-outlet></router-outlet>
</main>

<footer class="border-t">
  <div
    class="mx-auto max-w-7xl px-4 py-6 text-xs text-gray-500 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div>© {{ currentYear }} Premium Shop</div>
    <div class="flex gap-3">
      <span>Instant activation*</span>
      <span>•</span>
      <span>WhatsApp support</span>
    </div>
  </div>
</footer>
