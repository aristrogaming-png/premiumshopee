<section class="panel" style="max-width: 420px; margin: 30px auto">
  <h1 class="text-2xl font-bold">Admin login</h1>
  <p class="muted text-sm">Manage products, artwork and storefront banners.</p>
  <form (ngSubmit)="login()">
    <label class="field"
      >Email<input
        name="email"
        type="email"
        [(ngModel)]="email"
        autocomplete="username"
        required /></label
    ><label class="field"
      >Password<input
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
    /></label>
    <p *ngIf="errorMessage" class="error-message" role="alert">
      {{ errorMessage }}
    </p>
    <button type="submit" class="btn-primary" [disabled]="busy">
      {{ busy ? "Signing in?" : "Sign in" }}
    </button>
  </form>
</section>
