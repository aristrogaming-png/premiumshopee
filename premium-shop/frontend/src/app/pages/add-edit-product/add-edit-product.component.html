<div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">
    {{ isEdit ? 'Edit Product' : 'Add Product' }}
  </h2>
  <form [formGroup]="productForm" (ngSubmit)="save()" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium" for="name">Name</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="w-full border border-gray-300 p-2 rounded"
      />
    </div>
    <div>
      <label class="block mb-1 font-medium" for="price">Price</label>
      <input
        id="price"
        type="number"
        formControlName="price"
        class="w-full border border-gray-300 p-2 rounded"
      />
    </div>
    <div>
      <label class="block mb-1 font-medium" for="category">Category</label>
      <input
        id="category"
        type="text"
        formControlName="category"
        class="w-full border border-gray-300 p-2 rounded"
      />
    </div>
    <div>
      <label class="block mb-1 font-medium" for="imageUrl">Image URL</label>
      <input
        id="imageUrl"
        type="text"
        formControlName="imageUrl"
        class="w-full border border-gray-300 p-2 rounded"
      />
    </div>
    <div>
      <label class="block mb-1 font-medium" for="description"
        >Description</label
      >
      <textarea
        id="description"
        rows="3"
        formControlName="description"
        class="w-full border border-gray-300 p-2 rounded"
      ></textarea>
    </div>
    <div>
      <label class="block mb-1 font-medium" for="stock">Stock</label>
      <input
        id="stock"
        type="number"
        formControlName="stock"
        class="w-full border border-gray-300 p-2 rounded"
      />
    </div>
    <div class="text-right">
      <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
      >
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>
