<div class="admin-heading">
  <h1>{{ isEdit ? "Edit product" : "Add product" }}</h1>
  <a routerLink="/admin" class="text-link">Back to inventory</a>
</div>
<div *ngIf="loading" class="notice" role="status">Loading product?</div>
<div *ngIf="error" role="alert" class="error-message">
  {{ error }}
  <button *ngIf="loadError" type="button" class="text-link" (click)="load()">
    Retry
  </button>
</div>
<form
  *ngIf="!loading && !loadError"
  [formGroup]="productForm"
  (ngSubmit)="save()"
>
  <fieldset [disabled]="saving" class="editor-layout">
    <div class="panel">
      <h2 class="text-lg font-bold">Product details</h2>
      <label class="field"
        >Name *<input formControlName="name" required maxlength="200"
      /></label>
      <div class="form-grid">
        <label class="field"
          >Price ($) *<input
            formControlName="price"
            type="number"
            min="0"
            step="any"
            required /></label
        ><label class="field"
          >Stock *<input
            formControlName="stock"
            type="number"
            min="0"
            step="1"
            required
        /></label>
      </div>
      <label class="field"
        >Category *<input formControlName="category" required maxlength="200"
      /></label>
      <label class="field"
        >Description<textarea
          formControlName="description"
          rows="6"
          maxlength="20000"
        ></textarea>
      </label>
      <label class="field"
        >Plan summary (optional)<input
          formControlName="planLabel"
          maxlength="200"
          placeholder="Use the actual plan name"
      /></label>
      <label class="field"
        >Duration in months (optional)<input
          formControlName="durationMonths"
          type="number"
          min="1"
          max="1200"
          step="1"
      /></label>
      <p class="muted text-sm">
        Leave duration blank if it does not apply. Prices remain in the existing
        $ currency.
      </p>
    </div>
    <div>
      <app-image-input
        [value]="image"
        (valueChange)="image = $event"
        (busyChange)="mediaBusy = $event"
        purpose="product"
        [disabled]="saving"
      ></app-image-input>
    </div>
  </fieldset>
  <div class="action-row">
    <button
      type="submit"
      class="btn-primary"
      [disabled]="saving || mediaBusy || productForm.invalid"
    >
      {{ saving ? "Saving?" : "Save product" }}</button
    ><span *ngIf="mediaBusy" class="muted text-sm"
      >Finish or cancel the image change before saving.</span
    >
  </div>
</form>
