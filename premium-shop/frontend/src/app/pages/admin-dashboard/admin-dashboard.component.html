<div class="admin-heading">
  <h1>Inventory</h1>
  <div class="action-row">
    <a routerLink="/admin/add" class="btn-primary">Add product</a
    ><button type="button" class="btn-secondary" (click)="logout()">
      Log out
    </button>
  </div>
</div>
<nav class="admin-tabs" aria-label="Admin sections">
  <a routerLink="/admin" class="active" aria-current="page">Products</a
  ><a routerLink="/admin/banners">Banners</a>
</nav>
<p *ngIf="loading" role="status" class="notice">Loading inventory?</p>
<div *ngIf="error" role="alert" class="error-message">
  {{ error }}
  <button type="button" class="text-link" (click)="loadProducts()">
    Retry
  </button>
</div>
<div class="panel table-scroll">
  <table class="admin-table">
    <thead>
      <tr>
        <th scope="col">Product</th>
        <th scope="col">Category</th>
        <th scope="col">Price</th>
        <th scope="col">Stock</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>$ {{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <div class="action-row">
            <a [routerLink]="['/admin/edit', product.id]" class="btn-secondary"
              >Edit</a
            ><button
              class="btn-danger"
              type="button"
              (click)="deleteProduct(product.id)"
              [disabled]="!!deleting"
            >
              {{ deleting === product.id ? "Deleting?" : "Delete" }}
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="!loading && !error && !products.length" class="empty-note">
    No products yet.
  </p>
</div>
