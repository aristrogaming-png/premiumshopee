<section class="mt-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Premium Subscriptions</h2>
      <p class="text-sm text-gray-600">
        Verified plans • Instant WhatsApp checkout
      </p>
    </div>

    <!-- Search -->
    <div class="w-72">
      <input type="text" placeholder="Search subscriptions…" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
        class="w-full rounded-xl border px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
  </div>

  <!-- Category Pills -->
  <div class="mb-6 flex flex-wrap gap-2">
    <button (click)="selectCategory('')" class="rounded-full px-4 py-2 text-sm font-semibold border transition"
      [ngClass]="selectedCategory === '' 
        ? 'bg-blue-600 text-white border-blue-600' 
        : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-100'">
      All
    </button>

    <button *ngFor="let c of categories" (click)="selectCategory(c)"
      class="rounded-full px-4 py-2 text-sm font-semibold border transition" [ngClass]="selectedCategory === c
        ? 'bg-blue-600 text-white border-blue-600'
        : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-100'">
      {{ c }}
    </button>
  </div>

  <!-- PRODUCT GRID -->
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let product of filteredProducts"
      class="group rounded-2xl border bg-white shadow-sm hover:shadow-lg transition overflow-hidden"
      [ngClass]="product.stock === 0 ? 'opacity-60' : ''">
      <!-- ✅ OPTIMIZED IMAGE -->
      <div class="relative aspect-[16/9] w-full overflow-hidden bg-gray-100">
        <img [src]="product.imageUrl || '/assets/placeholder.jpg'" [alt]="product.name" loading="lazy" decoding="async"
          (error)="onImageError($event)"
          class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" />
      </div>

      <div class="p-5">
        <div class="flex justify-between items-start gap-3">
          <h3 class="text-base font-bold text-gray-900 line-clamp-2">
            {{ product.name }}
          </h3>

          <div class="text-right">
            <div class="text-lg font-extrabold text-blue-600">
              ${{ product.price }}
            </div>
            <div class="text-xs text-gray-500">Best price</div>
          </div>
        </div>

        <p class="mt-2 text-sm text-gray-600 line-clamp-3">
          {{ product.description }}
        </p>

        <!-- Stock -->
        <div class="mt-2 text-xs">
          <span *ngIf="product.stock >= 5" class="text-green-600 font-semibold">
            In stock
          </span>
          <span *ngIf="product.stock > 0 && product.stock < 5" class="text-yellow-600 font-semibold">
            Hurry! {{ product.stock }} left
          </span>
          <span *ngIf="product.stock === 0" class="text-red-600 font-semibold">
            Out of stock
          </span>
        </div>

        <!-- Actions -->
        <div class="mt-4 flex gap-2">
          <a [routerLink]="['/product', product.id]"
            class="flex-1 rounded-xl border px-4 py-2 text-center text-sm font-semibold text-gray-700 hover:bg-gray-100 transition">
            Details
          </a>

          <button (click)="buyNow(product)" [disabled]="product.stock === 0"
            class="flex-1 rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition disabled:opacity-40">
            Buy Now
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="filteredProducts.length === 0" class="mt-12 rounded-2xl border bg-white p-8 text-center">
    <h3 class="text-lg font-bold text-gray-900">No results found</h3>
    <p class="text-sm text-gray-600 mt-1">
      Try a different search or category
    </p>
  </div>
</section>
