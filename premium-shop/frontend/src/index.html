<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="utf-8" />
  <base href="/" />
  <link rel="preconnect" href="https://premium-shop-backend.onrender.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />

  <title>
    Premium Dukan
  </title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />


  <!--
    Detect theme BEFORE Angular loads.

    This prevents the website from flashing
    white before switching to dark mode.
  -->

  <script>

    (function () {

      try {

        var savedTheme =
          localStorage.getItem('theme');

        var useDark = savedTheme === 'dark';

        document
          .documentElement
          .classList
          .toggle(
            'dark',
            useDark
          );

      } catch (e) {

        // Angular will initialize theme later

      }

    })();

  </script>

</head>


<body class="
    bg-gray-50
    text-gray-900

    transition-colors
    duration-300

    dark:bg-gray-950
    dark:text-gray-100
  ">

  <app-root></app-root>

</body>

</html>
