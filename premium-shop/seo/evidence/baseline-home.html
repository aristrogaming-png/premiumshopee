  <!--
    Detect theme BEFORE Angular loads.

    This prevents the website from flashing
    white before switching to dark mode.
  -->

  <script>

    (function () {

      try {

        var savedTheme =
          localStorage.getItem('theme');

        var useDark = savedTheme === 'dark';

        document
          .documentElement
          .classList
          .toggle(
            'dark',
            useDark
          );

      } catch (e) {

        // Angular will initialize theme later

      }

    })();

  </script>
